<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🔢 2048</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .grid-2048 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; width: 100%; max-width: 480px; background: #D4C5C9; border-radius: 16px; padding: 14px; }
    .cell-2048 { aspect-ratio: 1; background: #E8DDE0; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-size: 2rem; color: #776e70; transition: all 0.12s var(--ease-bounce); }
    .cell-2048[data-value="2"] { background: #FFFBF7; color: #5C5C6E; }
    .cell-2048[data-value="4"] { background: #FFE8D6; color: #5C5C6E; }
    .cell-2048[data-value="8"] { background: #FFDAC1; color: #5C5C6E; }
    .cell-2048[data-value="16"] { background: #FFB5C2; color: #fff; font-size: 1.6rem; }
    .cell-2048[data-value="32"] { background: #FF9AA2; color: #fff; font-size: 1.6rem; }
    .cell-2048[data-value="64"] { background: #FF7B7B; color: #fff; font-size: 1.6rem; }
    .cell-2048[data-value="128"] { background: #FFDAC1; color: #fff; font-size: 1.4rem; }
    .cell-2048[data-value="256"] { background: #E2F0CB; color: #5C5C6E; font-size: 1.4rem; }
    .cell-2048[data-value="512"] { background: #B5EAD7; color: #5C5C6E; font-size: 1.4rem; }
    .cell-2048[data-value="1024"] { background: #B5D8EB; color: #fff; font-size: 1.2rem; }
    .cell-2048[data-value="2048"] { background: #C7CEEA; color: #fff; font-size: 1.2rem; animation: tileWin 0.5s var(--ease-bounce); }
    .cell-2048[data-value="4096"] { background: #FFB5C2; color: #fff; font-size: 1.1rem; }
    .cell-2048.new-tile { animation: popIn 0.2s var(--ease-bounce); }
    .cell-2048.merged { animation: mergePop 0.25s var(--ease-bounce); }
    @keyframes mergePop { 0% { transform: scale(0.7); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }
    @keyframes tileWin { 0% { transform: scale(1); } 25% { transform: scale(1.25); } 50% { transform: scale(0.95); } 75% { transform: scale(1.1); } 100% { transform: scale(1); } }
    @media (max-width: 500px) { .grid-2048 { gap: 8px; max-width: 360px; padding: 8px; } .cell-2048 { font-size: 1.5rem; border-radius: 8px; } }
  </style>
</head>
<body>
<div class="game-page">
  <div class="game-header">
    <button class="back-btn" onclick="window.location.href='../index.html'">← 返回</button>
    <span class="game-title">🔢 2048</span>
  </div>
  <div class="score-bar">
    <span class="score-item">🏆 得分: <strong id="score">0</strong></span>
    <span class="score-item">⭐ 最佳: <strong id="best">0</strong></span>
  </div>
  <div style="display:flex;gap:8px;margin-bottom:8px;">
    <button class="btn btn-mint" id="undoBtn" style="font-size:0.85rem;padding:8px 16px;">↩ 撤销</button>
  </div>
  <div class="game-board"><div class="grid-2048" id="grid"></div></div>
  <div class="dpad">
    <button class="dpad-btn dpad-up">▲</button>
    <button class="dpad-btn dpad-left">◀</button>
    <button class="dpad-btn dpad-right">▶</button>
    <button class="dpad-btn dpad-down">▼</button>
  </div>
</div>

<script src="../js/utils.js"></script>
<script>
(function() {
  const gridEl = document.getElementById('grid');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const undoBtn = document.getElementById('undoBtn');

  let grid = [], score = 0;
  let history = [];

  function init() {
    grid = Array.from({ length: 4 }, () => Array(4).fill(0));
    score = 0; history = [];
    scoreEl.textContent = '0';
    bestEl.textContent = loadBestScore('2048');
    undoBtn.style.opacity = '0.4';
    addRandomTile(); addRandomTile();
    render();
  }

  function saveState() { history.push({ grid: grid.map(r => [...r]), score }); if (history.length > 20) history.shift(); undoBtn.style.opacity = '1'; }

  function undo() {
    if (history.length === 0) return;
    const prev = history.pop();
    grid = prev.grid; score = prev.score;
    scoreEl.textContent = score;
    render();
    if (history.length === 0) undoBtn.style.opacity = '0.4';
  }

  function addRandomTile() {
    const empty = [];
    for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) if (grid[r][c] === 0) empty.push({ r, c });
    if (empty.length === 0) return;
    const { r, c } = pickRandom(empty);
    grid[r][c] = Math.random() < 0.9 ? 2 : 4;
  }

  function render(mergedSet = null, newTiles = null) {
    gridEl.innerHTML = '';
    for (let r = 0; r < 4; r++)
      for (let c = 0; c < 4; c++) {
        const cell = document.createElement('div'); cell.className = 'cell-2048';
        const v = grid[r][c]; cell.textContent = v || ''; cell.dataset.value = v || '';
        const key = r * 4 + c;
        if (mergedSet && mergedSet.has(key)) cell.classList.add('merged');
        if (newTiles && newTiles.has(key)) cell.classList.add('new-tile');
        gridEl.appendChild(cell);
      }
  }

  function move(dir) {
    const old = grid.map(row => [...row]);
    let merged = new Set(), newTiles = new Set();

    function slideRow(row) {
      let arr = row.filter(v => v !== 0); const mergedIdx = [];
      for (let i = 0; i < arr.length - 1; i++) { if (arr[i] === arr[i + 1]) { arr[i] *= 2; score += arr[i]; mergedIdx.push(i); arr.splice(i + 1, 1); } }
      while (arr.length < 4) arr.push(0);
      return { arr, mergedIdx };
    }

    const processors = {
      left: () => {
        for (let r = 0; r < 4; r++) { const { arr, mergedIdx } = slideRow(grid[r]); mergedIdx.forEach(i => merged.add(r * 4 + i)); for (let c = 0; c < 4; c++) { if (grid[r][c] !== arr[c] && arr[c] !== 0) newTiles.add(r * 4 + c); grid[r][c] = arr[c]; } }
      },
      right: () => {
        for (let r = 0; r < 4; r++) { const rev = [...grid[r]].reverse(); const { arr, mergedIdx } = slideRow(rev); const result = [...arr].reverse(); mergedIdx.forEach(i => merged.add(r * 4 + (3 - i))); for (let c = 0; c < 4; c++) { if (grid[r][c] !== result[c] && result[c] !== 0) newTiles.add(r * 4 + c); grid[r][c] = result[c]; } }
      },
      up: () => {
        for (let c = 0; c < 4; c++) { let col = [grid[0][c],grid[1][c],grid[2][c],grid[3][c]]; const { arr, mergedIdx } = slideRow(col); mergedIdx.forEach(i => merged.add(i * 4 + c)); for (let r = 0; r < 4; r++) { if (grid[r][c] !== arr[r] && arr[r] !== 0) newTiles.add(r * 4 + c); grid[r][c] = arr[r]; } }
      },
      down: () => {
        for (let c = 0; c < 4; c++) { let col = [grid[3][c],grid[2][c],grid[1][c],grid[0][c]]; const { arr, mergedIdx } = slideRow(col); const result = [...arr].reverse(); mergedIdx.forEach(i => merged.add((3 - i) * 4 + c)); for (let r = 0; r < 4; r++) { if (grid[r][c] !== result[r] && result[r] !== 0) newTiles.add(r * 4 + c); grid[r][c] = result[r]; } }
      }
    };
    processors[dir]();

    const changed = !grid.every((row, r) => row.every((v, c) => v === old[r][c]));
    if (!changed) return;

    saveState();
    addRandomTile();
    scoreEl.textContent = score;
    if (score > loadBestScore('2048')) { saveBestScore('2048', score); bestEl.textContent = score; }
    render(merged, newTiles);

    if (grid.some(row => row.some(v => v >= 2048))) {
      setTimeout(() => { showConfetti(80); showModal({ emoji: '🎉', title: '恭喜！', message: `你达到了 2048！\n得分: ${score}`, buttons: [{ text: '继续挑战', cls: 'btn-primary', onClick: () => {} }, { text: '再来一局', cls: 'btn-mint', onClick: init }, { text: '返回大厅', cls: 'btn-secondary', onClick: () => { window.location.href = '../index.html'; } }] }); }, 300);
    }
    if (isGameOver()) {
      setTimeout(() => { showModal({ emoji: '😢', title: '游戏结束', message: `无法移动了！\n得分: ${score}`, buttons: [{ text: '再来一局', cls: 'btn-primary', onClick: init }, { text: '返回大厅', cls: 'btn-secondary', onClick: () => { window.location.href = '../index.html'; } }] }); }, 400);
    }
  }

  function isGameOver() {
    for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) { if (grid[r][c] === 0) return false; if (r < 3 && grid[r][c] === grid[r + 1][c]) return false; if (c < 3 && grid[r][c] === grid[r][c + 1]) return false; }
    return true;
  }

  undoBtn.addEventListener('click', undo);

  document.addEventListener('keydown', (e) => {
    if (e.ctrlKey && e.key === 'z') { e.preventDefault(); undo(); return; }
    const map = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', w: 'up', s: 'down', a: 'left', d: 'right' };
    if (map[e.key]) { move(map[e.key]); e.preventDefault(); }
  });

  detectSwipe(gridEl, (dir) => move(dir));
  setupDpad({ up: () => move('up'), down: () => move('down'), left: () => move('left'), right: () => move('right') });

  init();
})();
</script>
</body>
</html>
