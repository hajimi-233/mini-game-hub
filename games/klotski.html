<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🧩 华容道</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .klotski-board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; width: 100%; max-width: 400px; background: #D4C5C9; border-radius: 16px; padding: 10px; touch-action: manipulation; }
    .klotski-tile { aspect-ratio: 1; background: var(--lavender); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-size: 1.8rem; color: #fff; cursor: pointer; transition: transform 0.15s var(--ease-smooth), box-shadow 0.15s; box-shadow: 0 3px 8px rgba(0,0,0,0.1); user-select: none; -webkit-user-select: none; }
    .klotski-tile:hover { transform: scale(1.04); box-shadow: 0 5px 14px rgba(0,0,0,0.15); }
    .klotski-tile:active { transform: scale(0.95); }
    .klotski-tile.empty { background: transparent; box-shadow: none; cursor: default; }
    .klotski-tile.empty:hover { transform: none; }
    .klotski-tile.correct { background: var(--mint); color: var(--text); }
    .diff-selector { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; justify-content: center; }
    .diff-btn { font-family: var(--font-body); font-size: 0.85rem; border: 2px solid var(--lavender); background: var(--white); border-radius: 12px; padding: 6px 14px; cursor: pointer; transition: all 0.2s; color: var(--text); }
    .diff-btn.active { background: var(--lavender); border-color: var(--lavender); font-weight: 700; }
    @media (max-width: 420px) { .klotski-board { gap: 4px; max-width: 320px; padding: 8px; } .klotski-tile { font-size: 1.3rem; } }
  </style>
</head>
<body>
<div class="game-page">
  <div class="game-header">
    <button class="back-btn" onclick="window.location.href='../index.html'">← 返回</button>
    <span class="game-title">🧩 数字推盘</span>
  </div>

  <div class="score-bar">
    <span class="score-item">🏆 步数: <strong id="moves">0</strong></span>
    <span class="score-item">⭐ 最佳: <strong id="best">-</strong></span>
    <span class="score-item">⏱️ <strong id="timer">00:00</strong></span>
  </div>

  <div class="diff-selector">
    <button class="diff-btn active" data-size="3">3×3 简单</button>
    <button class="diff-btn" data-size="4">4×4 经典</button>
    <button class="diff-btn" data-size="5">5×5 挑战</button>
  </div>

  <div class="game-board" id="board"></div>

  <button class="btn btn-mint" id="shuffleBtn" style="margin-top:12px;">🔀 重新打乱</button>
</div>

<script src="../js/utils.js"></script>
<script>
(function() {
  const boardEl = document.getElementById('board');
  const movesEl = document.getElementById('moves');
  const bestEl = document.getElementById('best');
  const timerEl = document.getElementById('timer');

  let size = 3, tiles = [], emptyR, emptyC, moves = 0, timerInterval = null, seconds = 0, gameStarted = false;

  function getStorageKey() { return 'klotski_' + size; }

  function init() {
    clearInterval(timerInterval);
    size = parseInt(document.querySelector('.diff-btn.active').dataset.size);
    const total = size * size;
    tiles = Array.from({ length: total - 1 }, (_, i) => i + 1);
    tiles.push(0); // 0 = empty
    emptyR = size - 1; emptyC = size - 1;
    moves = 0; seconds = 0; gameStarted = false;
    movesEl.textContent = '0'; timerEl.textContent = '00:00';
    bestEl.textContent = loadBestScore(getStorageKey()) || '-';
    render();

    // Auto shuffle
    shuffleBoard();
  }

  function shuffleBoard() {
    // Do many random valid moves
    const total = size * size;
    let flat = [...Array.from({ length: total - 1 }, (_, i) => i + 1), 0];
    // Fisher-Yates then ensure solvable
    do {
      for (let i = flat.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [flat[i], flat[j]] = [flat[j], flat[i]]; }
    } while (!isSolvable(flat));

    for (let r = 0; r < size; r++)
      for (let c = 0; c < size; c++) {
        const idx = r * size + c;
        if (flat[idx] === 0) { emptyR = r; emptyC = c; }
      }
    // Update tiles as 2D from flat
    const grid = [];
    for (let r = 0; r < size; r++) grid.push(flat.slice(r * size, (r + 1) * size));
    tiles = grid;
    moves = 0; seconds = 0; gameStarted = false;
    clearInterval(timerInterval);
    movesEl.textContent = '0'; timerEl.textContent = '00:00';
    render();
  }

  function isSolvable(flat) {
    const n = flat.length;
    let inversions = 0;
    for (let i = 0; i < n; i++) {
      if (flat[i] === 0) continue;
      for (let j = i + 1; j < n; j++) {
        if (flat[j] !== 0 && flat[i] > flat[j]) inversions++;
      }
    }
    if (size % 2 === 1) return inversions % 2 === 0; // Odd grid: must be even inversions
    // Even grid: need to account for blank row
    const blankRow = Math.floor(flat.indexOf(0) / size);
    return (inversions % 2 === 0) === ((size - 1 - blankRow) % 2 === 0);
  }

  function getFlat() {
    const flat = [];
    for (let r = 0; r < size; r++)
      for (let c = 0; c < size; c++)
        flat.push(r === emptyR && c === emptyC ? 0 : tiles[r][c]);
    return flat;
  }

  function render() {
    boardEl.innerHTML = '';
    boardEl.className = 'klotski-board';
    boardEl.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
    for (let r = 0; r < size; r++)
      for (let c = 0; c < size; c++) {
        const cell = document.createElement('div'); cell.className = 'klotski-tile';
        const v = (r === emptyR && c === emptyC) ? 0 : tiles[r][c];
        if (v === 0) cell.classList.add('empty');
        else {
          cell.textContent = v;
          // Check if in correct position
          const correctVal = r * size + c + 1;
          if (v === correctVal && correctVal < size * size) cell.classList.add('correct');
          cell.addEventListener('click', () => tileClick(r, c));
        }
        boardEl.appendChild(cell);
      }
  }

  function tileClick(r, c) {
    if (r === emptyR && c === emptyC) return;
    const dr = Math.abs(r - emptyR), dc = Math.abs(c - emptyC);
    if (!((dr === 1 && dc === 0) || (dr === 0 && dc === 1))) return; // Not adjacent to empty

    // Swap
    tiles[emptyR][emptyC] = tiles[r][c];
    tiles[r][c] = 0;
    emptyR = r; emptyC = c;
    moves++;
    movesEl.textContent = moves;

    if (!gameStarted) { gameStarted = true; timerInterval = setInterval(() => { seconds++; timerEl.textContent = formatTime(seconds); }, 1000); }

    render();

    if (checkWin()) {
      clearInterval(timerInterval); gameStarted = false;
      const best = loadBestScore(getStorageKey());
      if (!best || moves < best) saveBestScore(getStorageKey(), moves);
      bestEl.textContent = loadBestScore(getStorageKey());
      setTimeout(() => {
        showConfetti(60);
        showModal({
          emoji: '🏆', title: '恭喜完成！',
          message: `步数: ${moves} | 用时: ${formatTime(seconds)}\n${(!best || moves < best) ? '🏅 新纪录！' : ''}`,
          buttons: [{ text: '再来一局', cls: 'btn-primary', onClick: init }, { text: '返回大厅', cls: 'btn-secondary', onClick: () => { window.location.href = '../index.html'; } }]
        });
      }, 300);
    }
  }

  function checkWin() {
    for (let r = 0; r < size; r++)
      for (let c = 0; c < size; c++) {
        if (r === size - 1 && c === size - 1) { if (tiles[r][c] !== 0) return false; }
        else { if (tiles[r][c] !== r * size + c + 1) return false; }
      }
    return true;
  }

  document.querySelectorAll('.diff-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      init();
    });
  });

  document.getElementById('shuffleBtn').addEventListener('click', () => {
    clearInterval(timerInterval); gameStarted = false;
    moves = 0; seconds = 0;
    movesEl.textContent = '0'; timerEl.textContent = '00:00';
    shuffleBoard();
  });

  init();
})();
</script>
</body>
</html>
