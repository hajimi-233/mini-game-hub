<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🏓 打砖块</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .breakout-wrapper { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    canvas#breakoutCanvas { display: block; border-radius: 16px; box-shadow: var(--shadow-card); background: var(--white); touch-action: manipulation; max-width: 100%; }
  </style>
</head>
<body>
<div class="game-page">
  <div class="game-header">
    <button class="back-btn" onclick="window.location.href='../index.html'">← 返回</button>
    <span class="game-title">🏓 打砖块</span>
  </div>
  <div class="score-bar">
    <span class="score-item">🏆 得分: <strong id="score">0</strong></span>
    <span class="score-item">❤️ <strong id="lives">3</strong></span>
    <span class="score-item">📊 <strong id="level">1</strong></span>
  </div>
  <div class="breakout-wrapper">
    <canvas id="breakoutCanvas"></canvas>
    <div style="display:flex;gap:8px;">
      <button class="btn btn-primary" id="startBtn">开始游戏</button>
    </div>
  </div>
</div>

<script src="../js/utils.js"></script>
<script>
(function() {
  const canvas = document.getElementById('breakoutCanvas');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const livesEl = document.getElementById('lives');
  const levelEl = document.getElementById('level');
  const startBtn = document.getElementById('startBtn');

  const COLS_BRICK = 10, BRICK_H = 20;
  const PADDLE_W = 90, PADDLE_H = 14, BALL_R = 7;
  let bricks = [], ball, paddle, score, lives, level, gameRunning, animFrameId;
  let particles = [], powerUps = [];

  function resize() {
    const w = Math.min(480, window.innerWidth - 24);
    canvas.style.width = w + 'px'; canvas.style.height = (w * 0.75) + 'px';
    canvas.width = w; canvas.height = w * 0.75;
  }

  function init() {
    resize();
    score = 0; lives = 3; level = 1;
    scoreEl.textContent = '0'; livesEl.textContent = '3'; levelEl.textContent = '1';
    gameRunning = false; particles = []; powerUps = [];
    if (animFrameId) cancelAnimationFrame(animFrameId);
    animFrameId = null;
    buildLevel();
    paddle = { x: canvas.width / 2 - PADDLE_W / 2, y: canvas.height - 30, w: PADDLE_W, h: PADDLE_H };
    ball = { x: paddle.x + PADDLE_W / 2, y: paddle.y - BALL_R * 2, vx: 3, vy: -3, onPaddle: true };
    draw();
  }

  function buildLevel() {
    const rows = Math.min(3 + level, 8);
    const gap = 4, padding = 20;
    const brickW = (canvas.width - padding * 2 - (COLS_BRICK - 1) * gap) / COLS_BRICK;
    bricks = [];
    const pastelColors = ['#FFB5C2','#B5EAD7','#C7CEEA','#FFDAC1','#E2F0CB','#B5D8EB','#FFF1B0','#FF9AA2'];
    for (let row = 0; row < rows; row++) {
      for (let col = 0; col < COLS_BRICK; col++) {
        const hp = row < 2 ? 1 : (row < 4 ? 2 : 3);
        bricks.push({ x: padding + col * (brickW + gap), y: 50 + row * (BRICK_H + gap), w: brickW, h: BRICK_H, hp, maxHp: hp, color: pastelColors[row % pastelColors.length] });
      }
    }
  }

  function startGame() {
    if (gameRunning) return;
    gameRunning = true;
    ball.onPaddle = false;
    ball.vx = 3; ball.vy = -3;
    startBtn.textContent = '游戏中...';
    startBtn.style.opacity = '0.5';
    lastTime = performance.now();
    animFrameId = requestAnimationFrame(gameLoop);
  }

  let lastTime = 0;

  function gameLoop(timestamp) {
    if (!gameRunning) return;
    const dt = Math.min((timestamp - lastTime) / 16.67, 3); // Cap at 3x speed
    lastTime = timestamp;

    update(dt);
    draw();
    animFrameId = requestAnimationFrame(gameLoop);
  }

  function update(dt) {
    if (ball.onPaddle) {
      ball.x = paddle.x + paddle.w / 2;
      ball.y = paddle.y - BALL_R * 2;
      return;
    }

    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    // Wall bounces
    if (ball.x - BALL_R <= 0) { ball.x = BALL_R; ball.vx = Math.abs(ball.vx); }
    if (ball.x + BALL_R >= canvas.width) { ball.x = canvas.width - BALL_R; ball.vx = -Math.abs(ball.vx); }
    if (ball.y - BALL_R <= 0) { ball.y = BALL_R; ball.vy = Math.abs(ball.vy); }

    // Bottom — lose life
    if (ball.y + BALL_R >= canvas.height) {
      lives--;
      livesEl.textContent = lives;
      if (lives <= 0) {
        gameRunning = false;
        if (animFrameId) cancelAnimationFrame(animFrameId);
        endGame();
      } else {
        ball.onPaddle = true;
        ball.vx = 3; ball.vy = -3;
      }
      return;
    }

    // Paddle collision
    if (ball.vy > 0 && ball.y + BALL_R >= paddle.y && ball.x >= paddle.x && ball.x <= paddle.x + paddle.w) {
      const hitPos = (ball.x - paddle.x) / paddle.w; // 0..1
      const angle = (hitPos - 0.5) * Math.PI / 3; // -60° to +60°
      const speed = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
      ball.vx = Math.sin(angle) * speed;
      ball.vy = -Math.abs(Math.cos(angle) * speed);
      ball.y = paddle.y - BALL_R;
    }

    // Brick collisions
    for (let i = bricks.length - 1; i >= 0; i--) {
      const b = bricks[i];
      if (ball.x + BALL_R > b.x && ball.x - BALL_R < b.x + b.w &&
          ball.y + BALL_R > b.y && ball.y - BALL_R < b.y + b.h) {
        // Bounce
        const overlapX = Math.min(ball.x + BALL_R - b.x, b.x + b.w - (ball.x - BALL_R));
        const overlapY = Math.min(ball.y + BALL_R - b.y, b.y + b.h - (ball.y - BALL_R));
        if (overlapX < overlapY) ball.vx = -ball.vx;
        else ball.vy = -ball.vy;

        b.hp--;
        if (b.hp <= 0) {
          score += (b.maxHp * 10);
          spawnBrickParticles(b.x + b.w / 2, b.y + b.h / 2, b.color);
          // Power-up chance
          if (Math.random() < 0.2) {
            powerUps.push({ x: b.x + b.w / 2, y: b.y + b.h / 2, vy: 2, type: Math.random() < 0.5 ? 'widen' : 'slow' });
          }
          bricks.splice(i, 1);
        }
        scoreEl.textContent = score;
        break; // Only one collision per frame
      }
    }

    // Power-ups
    for (let i = powerUps.length - 1; i >= 0; i--) {
      const pu = powerUps[i];
      pu.y += pu.vy * dt;
      if (pu.y > paddle.y && pu.y < paddle.y + paddle.h && pu.x > paddle.x && pu.x < paddle.x + paddle.w) {
        if (pu.type === 'widen') { paddle.w = Math.min(160, paddle.w + 30); setTimeout(() => { paddle.w = PADDLE_W; }, 8000); }
        if (pu.type === 'slow') { ball.vx *= 0.6; ball.vy *= 0.6; setTimeout(() => { ball.vx /= 0.6; ball.vy /= 0.6; }, 6000); }
        powerUps.splice(i, 1);
      } else if (pu.y > canvas.height) { powerUps.splice(i, 1); }
    }

    // Particles
    particles = particles.filter(p => { p.life--; p.x += p.vx * 0.5; p.y += p.vy * 0.5; return p.life > 0; });

    // Check level clear
    if (bricks.length === 0) {
      level++; levelEl.textContent = level;
      ball.onPaddle = true;
      buildLevel();
    }
  }

  function spawnBrickParticles(x, y, color) {
    for (let i = 0; i < 8; i++) {
      particles.push({ x, y, vx: (Math.random() - 0.5) * 5, vy: (Math.random() - 0.5) * 5, life: 15, color });
    }
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#FFFBF7'; ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Bricks
    bricks.forEach(b => {
      ctx.fillStyle = b.hp === b.maxHp ? b.color : (b.hp === 1 ? '#FFB5C2' : b.color + '99');
      ctx.beginPath(); ctx.roundRect(b.x + 1, b.y + 1, b.w - 2, b.h - 2, 4); ctx.fill();
      // HP indicator for multi-hp bricks
      if (b.maxHp > 1) {
        ctx.fillStyle = '#fff'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(b.hp, b.x + b.w / 2, b.y + b.h / 2 + 4);
      }
      // Shine
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.fillRect(b.x + 3, b.y + 2, b.w * 0.6, 4);
    });

    // Paddle
    ctx.fillStyle = '#C7CEEA';
    ctx.beginPath(); ctx.roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.fillRect(paddle.x + 2, paddle.y + 1, paddle.w - 4, 4);

    // Ball
    ctx.fillStyle = '#FFB5C2';
    ctx.beginPath(); ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.beginPath(); ctx.arc(ball.x - 2, ball.y - 2, BALL_R * 0.4, 0, Math.PI * 2); ctx.fill();

    // Power-ups
    powerUps.forEach(pu => {
      ctx.fillStyle = pu.type === 'widen' ? '#B5EAD7' : '#B5D8EB';
      ctx.beginPath(); ctx.arc(pu.x, pu.y, 8, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(pu.type === 'widen' ? 'W' : 'S', pu.x, pu.y);
    });

    // Particles
    particles.forEach(p => {
      ctx.fillStyle = p.color + Math.floor(p.life / 15 * 255).toString(16).padStart(2, '0');
      ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI * 2); ctx.fill();
    });
  }

  function endGame() {
    gameRunning = false;
    if (animFrameId) cancelAnimationFrame(animFrameId);
    startBtn.textContent = '再来一局';
    startBtn.style.opacity = '1';
    saveBestScore('breakout', score);
    setTimeout(() => {
      showModal({
        emoji: '🏓', title: '游戏结束',
        message: `得分: ${score} | 等级: ${level}\n最佳: ${loadBestScore('breakout')}`,
        buttons: [{ text: '再来一局', cls: 'btn-primary', onClick: init }, { text: '返回大厅', cls: 'btn-secondary', onClick: () => { window.location.href = '../index.html'; } }]
      });
    }, 300);
  }

  // Mouse/Touch paddle control
  canvas.addEventListener('pointermove', (e) => {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    paddle.x = Math.max(0, Math.min(canvas.width - paddle.w, (e.clientX - rect.left) * scaleX - paddle.w / 2));
    if (ball.onPaddle && !gameRunning) draw();
  });

  canvas.addEventListener('click', () => { if (!gameRunning && ball.onPaddle) startGame(); });

  document.addEventListener('keydown', (e) => {
    if (e.key === ' ' || e.key === 'Enter') { if (!gameRunning && ball.onPaddle) startGame(); e.preventDefault(); }
    if (!gameRunning) return;
    const speed = 8;
    if (e.key === 'ArrowLeft' || e.key === 'a') paddle.x = Math.max(0, paddle.x - speed);
    if (e.key === 'ArrowRight' || e.key === 'd') paddle.x = Math.min(canvas.width - paddle.w, paddle.x + speed);
  });

  startBtn.addEventListener('click', () => { if (!gameRunning && ball.onPaddle) startGame(); else if (!gameRunning) init(); });

  window.addEventListener('resize', () => { resize(); draw(); });
  init();
  draw();
})();
</script>
</body>
</html>
