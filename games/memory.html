<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🧠 记忆翻牌</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .memory-board { display: grid; gap: 10px; width: 100%; max-width: 520px; perspective: 600px; margin: 0 auto; }
    .memory-card { aspect-ratio: 1; cursor: pointer; position: relative; }
    .memory-card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.45s var(--ease-bounce); transform-style: preserve-3d; }
    .memory-card.flipped .memory-card-inner { transform: rotateY(180deg); }
    .memory-card-front, .memory-card-back { position: absolute; inset: 0; border-radius: var(--radius-game); backface-visibility: hidden; display: flex; align-items: center; justify-content: center; }
    .memory-card-front { background: var(--lavender); font-size: 2.6rem; }
    .memory-card-back { background: var(--warm-yellow); transform: rotateY(180deg); font-size: 3.2rem; }
    .memory-card.matched .memory-card-back { background: var(--mint); }
    .memory-card.matched { pointer-events: none; animation: matchPop 0.4s var(--ease-bounce); }
    @keyframes matchPop { 0% { transform: scale(1); } 50% { transform: scale(1.15); } 100% { transform: scale(1); } }
    .opt-row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; align-items: center; margin-bottom: 8px; }
    .opt-btn { font-family: var(--font-body); font-size: 0.8rem; border: 2px solid var(--lavender); background: var(--white); border-radius: 10px; padding: 4px 10px; cursor: pointer; transition: all 0.2s; color: var(--text); }
    .opt-btn.on { background: var(--lavender); border-color: var(--lavender); font-weight: 700; }
    .diff-selector { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; justify-content: center; }
    .diff-btn { font-family: var(--font-body); font-size: 0.85rem; border: 2px solid var(--lavender); background: var(--white); border-radius: 12px; padding: 6px 14px; cursor: pointer; transition: all 0.2s; color: var(--text); }
    .diff-btn.active { background: var(--lavender); border-color: var(--lavender); font-weight: 700; }
    .countdown { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 50; background: rgba(255,251,247,0.9); }
    .countdown-num { font-family: var(--font-display); font-size: 5rem; color: var(--text); animation: countPop 0.6s var(--ease-bounce); }
    @keyframes countPop { 0% { transform: scale(2); opacity: 0; } 50% { transform: scale(0.9); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
    .record-item { font-size: 0.75rem; color: var(--text-light); display: block; }
    .timer-bar { width: 100%; max-width: 520px; height: 8px; background: #E8DDE0; border-radius: 4px; margin: 4px auto 8px; overflow: hidden; }
    .timer-bar-fill { height: 100%; background: var(--mint); border-radius: 4px; transition: width 1s linear, background 0.5s; }
    .timer-bar-fill.warn { background: var(--peach); }
    .timer-bar-fill.danger { background: var(--pink); }
    @media (max-width: 420px) { .memory-board { gap: 6px; max-width: 340px; } .memory-card-front { font-size: 1.8rem; } .memory-card-back { font-size: 2.2rem; } }
  </style>
</head>
<body>
<div class="game-page">
  <div class="game-header">
    <button class="back-btn" onclick="window.location.href='../index.html'">← 返回</button>
    <span class="game-title">🧠 记忆翻牌</span>
  </div>

  <div class="score-bar">
    <span class="score-item">🏆 步数: <strong id="moves">0</strong><span class="record-item" id="bestMovesLabel"></span></span>
    <span class="score-item">⏱️ <strong id="timer">00:00</strong><span class="record-item" id="bestTimeLabel"></span></span>
    <span class="score-item" id="starsDisplay">⭐ x0</span>
  </div>

  <div class="opt-row">
    <span style="font-size:0.8rem;color:var(--text-light);">模式:</span>
    <button class="opt-btn on" id="modeClassic">经典</button>
    <button class="opt-btn" id="modeTimed">⏱️ 60秒</button>
    <span style="font-size:0.8rem;color:var(--text-light);margin-left:8px;">主题:</span>
    <button class="opt-btn on" id="themeAnimals">🐾</button>
    <button class="opt-btn" id="themeFruit">🍓</button>
    <button class="opt-btn" id="themeFood">🍕</button>
  </div>

  <div class="timer-bar" id="timerBar" style="display:none;"><div class="timer-bar-fill" id="timerBarFill"></div></div>

  <div class="diff-selector">
    <button class="diff-btn active" data-grid="4x4">4x4 简单</button>
    <button class="diff-btn" data-grid="6x6">6x6 挑战</button>
  </div>

  <div id="board"></div>
</div>

<script src="../js/utils.js"></script>
<script>
(function() {
  const boardEl = document.getElementById('board');
  const movesEl = document.getElementById('moves'), timerEl = document.getElementById('timer');
  const bestMovesLabel = document.getElementById('bestMovesLabel'), bestTimeLabel = document.getElementById('bestTimeLabel');
  const starsDisplay = document.getElementById('starsDisplay');
  const timerBar = document.getElementById('timerBar'), timerBarFill = document.getElementById('timerBarFill');

  const THEMES = {
    animals: ['🐶','🐱','🐼','🐨','🐸','🦊','🐰','🐻','🐧','🐙','🦄','🐳','🐝','🦋','🐞','🦀','🐢','🦜','🐬','🐠'],
    fruit: ['🍎','🍊','🍋','🍇','🍓','🍒','🍑','🥝','🍌','🍉','🥭','🍍','🍐','🥥','🫐','🍈','🍏','🥑','🌽','🍠'],
    food: ['🍕','🍔','🌮','🍩','🧁','🎂','🍪','🍿','🍫','🍦','🥞','🧇','🍗','🍜','🍣','🥟','🍱','🥨','🍳','🧀']
  };
  let currentTheme = 'animals';

  let cards = [], flipped = [], matched = 0, moves = 0, lockBoard = false;
  let timerInterval = null, seconds = 0, gridCols = 4, gridRows = 4, gameStarted = false;
  let timedMode = false, timeLeft = 60, timedOver = false;

  function getStorageKey() { return `memory_${gridCols}x${gridRows}_${timedMode ? 't' : 'c'}`; }

  function loadRecords() {
    const bestMoves = loadBestScore(getStorageKey() + '_moves');
    const bestTime = loadBestScore(getStorageKey() + '_time');
    return { moves: bestMoves || Infinity, time: bestTime || Infinity };
  }

  function updateLabels() {
    const rec = loadRecords();
    bestMovesLabel.textContent = rec.moves < Infinity ? `最佳: ${rec.moves}步` : '';
    bestTimeLabel.textContent = rec.time < Infinity ? `最佳: ${formatTime(rec.time)}` : '';
  }

  function initGame() {
    clearInterval(timerInterval);
    cards = []; flipped = []; matched = 0; moves = 0; lockBoard = false; seconds = 0; gameStarted = false;
    timedOver = false; timeLeft = 60;
    movesEl.textContent = '0'; timerEl.textContent = timedMode ? '01:00' : '00:00';
    if (timedMode) { timerBar.style.display = 'block'; timerBarFill.style.width = '100%'; timerBarFill.className = 'timer-bar-fill'; }
    else { timerBar.style.display = 'none'; }
    starsDisplay.textContent = timedMode ? '🔥 x0' : '⭐ x0';
    updateLabels();

    const emojis = THEMES[currentTheme];
    const pairsNeeded = (gridCols * gridRows) / 2;
    const picked = shuffle([...emojis]).slice(0, pairsNeeded);
    cards = shuffle([...picked, ...picked].map((emoji, i) => ({ emoji, id: i, matched: false })));

    boardEl.className = 'memory-board';
    boardEl.style.gridTemplateColumns = `repeat(${gridCols}, 1fr)`;
    boardEl.innerHTML = '';
    cards.forEach((c, i) => {
      const card = document.createElement('div'); card.className = 'memory-card'; card.dataset.index = i;
      card.innerHTML = `<div class="memory-card-inner"><div class="memory-card-front">❓</div><div class="memory-card-back">${c.emoji}</div></div>`;
      card.addEventListener('click', () => flipCard(i, card));
      boardEl.appendChild(card);
    });

    // Quick peek
    lockBoard = true;
    document.querySelectorAll('.memory-card').forEach(el => el.classList.add('flipped'));
    setTimeout(() => {
      document.querySelectorAll('.memory-card').forEach(el => el.classList.remove('flipped'));
      lockBoard = false;
      startCountdown();
    }, timedMode ? 800 : 1500);
  }

  function startCountdown() {
    const overlay = document.createElement('div'); overlay.className = 'countdown';
    const num = document.createElement('div'); num.className = 'countdown-num';
    overlay.appendChild(num); document.body.appendChild(overlay);
    let count = 3;
    num.textContent = count;
    const iv = setInterval(() => {
      count--;
      if (count <= 0) { clearInterval(iv); overlay.remove(); gameStarted = true; if (timedMode) startTimedMode(); return; }
      num.textContent = count;
      num.style.animation = 'none'; num.offsetHeight; num.style.animation = 'countPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1)';
    }, 700);
  }

  function startTimedMode() {
    timeLeft = 60;
    timerInterval = setInterval(() => { timeLeft--; timerEl.textContent = formatTime(timeLeft); timerBarFill.style.width = (timeLeft / 60 * 100) + '%'; if (timeLeft <= 15) timerBarFill.classList.add('warn'); if (timeLeft <= 5) timerBarFill.classList.add('danger'); if (timeLeft <= 0) { clearInterval(timerInterval); timedOver = true; gameStarted = false; timerEl.textContent = '00:00'; timerBarFill.style.width = '0%'; setTimeout(() => { showModal({ emoji: '⏰', title: '时间到！', message: `配对: ${matched}/8\n得分: ${matched * 100}`, buttons: [{ text: '再来一局', cls: 'btn-primary', onClick: initGame }, { text: '返回大厅', cls: 'btn-secondary', onClick: () => { window.location.href = '../index.html'; } }] }); }, 300); } }, 1000);
  }

  function flipCard(index, cardEl) {
    if (lockBoard || !gameStarted || timedOver) return;
    if (cardEl.classList.contains('flipped') || cardEl.classList.contains('matched')) return;
    if (flipped.length >= 2) return;
    if (flipped.length === 1 && flipped[0].index === index) return;
    cardEl.classList.add('flipped'); flipped.push({ index, cardEl });
    if (flipped.length === 2) { moves++; movesEl.textContent = moves; if (!timerInterval && !timedMode) { seconds = 0; timerInterval = setInterval(() => { seconds++; timerEl.textContent = formatTime(seconds); }, 1000); } checkMatch(); }
  }

  function checkMatch() {
    const [a, b] = flipped;
    if (cards[a.index].emoji === cards[b.index].emoji) {
      cards[a.index].matched = cards[b.index].matched = true;
      a.cardEl.classList.add('matched'); b.cardEl.classList.add('matched');
      matched++; flipped = [];
      if (timedMode) { starsDisplay.textContent = '🔥 x' + matched; }
      else { starsDisplay.textContent = '⭐ x' + getStars(); }
      if (matched === (gridCols * gridRows) / 2) win();
    } else {
      lockBoard = true;
      setTimeout(() => { a.cardEl.classList.remove('flipped'); b.cardEl.classList.remove('flipped'); flipped = []; lockBoard = false; }, 600);
    }
  }

  function getStars() {
    if (gridCols === 4) { if (moves <= 10) return 3; if (moves <= 16) return 2; return 1; }
    else { if (moves <= 25) return 3; if (moves <= 40) return 2; return 1; }
  }

  function win() {
    clearInterval(timerInterval); gameStarted = false;
    const key = getStorageKey(); const rec = loadRecords();
    let newRecord = false;
    if (!timedMode) { if (moves < rec.moves) { saveBestScore(key + '_moves', moves); newRecord = true; } if (seconds < rec.time) { saveBestScore(key + '_time', seconds); newRecord = true; } }
    else { saveBestScore(key + '_time', timeLeft); starsDisplay.textContent = '🔥 x' + matched + ' (剩' + timeLeft + 's)'; }
    updateLabels();
    const stars = timedMode ? Math.ceil(matched / (gridCols * gridRows / 6)) || 1 : getStars();
    const starsEmoji = timedMode ? '🔥 x' + matched : ['','⭐','🌟🌟','🌟🌟🌟'][stars];
    setTimeout(() => {
      showConfetti(80);
      showModal({ emoji: '🎉', title: '恭喜过关！', message: `${starsEmoji}\n步数: ${moves} | 用时: ${formatTime(timedMode ? 60 - timeLeft : seconds)}${newRecord ? '\n🏆 新纪录！' : ''}`, buttons: [{ text: '再来一局', cls: 'btn-primary', onClick: initGame }, { text: '返回大厅', cls: 'btn-secondary', onClick: () => { window.location.href = '../index.html'; } }] });
    }, 500);
  }

  // Grid buttons
  document.querySelectorAll('.diff-btn').forEach(btn => { btn.addEventListener('click', () => { document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); const grid = btn.dataset.grid; gridCols = grid === '4x4' ? 4 : 6; gridRows = grid === '4x4' ? 4 : 6; initGame(); }); });

  // Mode buttons
  document.getElementById('modeClassic').addEventListener('click', function() { if (timedMode) { timedMode = false; document.getElementById('modeClassic').classList.add('on'); document.getElementById('modeTimed').classList.remove('on'); initGame(); } });
  document.getElementById('modeTimed').addEventListener('click', function() { if (!timedMode) { timedMode = true; document.getElementById('modeTimed').classList.add('on'); document.getElementById('modeClassic').classList.remove('on'); initGame(); } });

  // Theme buttons
  function setTheme(t) { currentTheme = t; document.querySelectorAll('[id^=theme]').forEach(b => b.classList.remove('on')); document.getElementById('theme' + t.charAt(0).toUpperCase() + t.slice(1)).classList.add('on'); initGame(); }
  document.getElementById('themeAnimals').addEventListener('click', () => setTheme('animals'));
  document.getElementById('themeFruit').addEventListener('click', () => setTheme('fruit'));
  document.getElementById('themeFood').addEventListener('click', () => setTheme('food'));

  initGame();
})();
</script>
</body>
</html>
