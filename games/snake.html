<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🐍 贪吃蛇</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .snake-wrapper { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    canvas#snakeCanvas { display: block; border-radius: 16px; box-shadow: var(--shadow-card); background: var(--white); touch-action: manipulation; max-width: 100%; }
    .opt-row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; align-items: center; }
    .opt-btn { font-family: var(--font-body); font-size: 0.8rem; border: 2px solid #ccc; background: var(--white); border-radius: 10px; padding: 4px 10px; cursor: pointer; transition: all 0.2s; color: var(--text); }
    .opt-btn.on { background: var(--mint); border-color: var(--mint); font-weight: 700; }
    .diff-btn { font-family: var(--font-body); font-size: 0.85rem; border: 2px solid var(--lavender); background: var(--white); border-radius: 12px; padding: 6px 14px; cursor: pointer; transition: all 0.2s; color: var(--text); }
    .diff-btn.active { background: var(--lavender); border-color: var(--lavender); font-weight: 700; }
    .pause-overlay { position: absolute; display: none; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,251,247,0.85); border-radius: 16px; justify-content: center; align-items: center; font-family: var(--font-display); font-size: 2rem; color: var(--text); z-index: 10; }
    .pause-overlay.show { display: flex; }
  </style>
</head>
<body>
<div class="game-page">
  <div class="game-header">
    <button class="back-btn" onclick="window.location.href='../index.html'">← 返回</button>
    <span class="game-title">🐍 贪吃蛇</span>
  </div>

  <div class="score-bar">
    <span class="score-item">🏆 得分: <strong id="score">0</strong></span>
    <span class="score-item">📏 长度: <strong id="length">3</strong></span>
    <span class="score-item">⭐ 最佳: <strong id="best">0</strong></span>
  </div>

  <div class="opt-row">
    <button class="opt-btn on" id="wrapBtn">🔄 穿墙</button>
    <span class="opt-row" style="gap:4px;">
      <button class="diff-btn active" data-speed="slow">🐢</button>
      <button class="diff-btn" data-speed="medium">🐍</button>
      <button class="diff-btn" data-speed="fast">⚡</button>
    </span>
    <span style="font-size:0.8rem;color:var(--text-light);" id="foodLabel"></span>
  </div>

  <div class="snake-wrapper">
    <div style="position:relative;display:inline-block;">
      <canvas id="snakeCanvas"></canvas>
      <div class="pause-overlay" id="pauseOverlay">⏸️ 已暂停</div>
    </div>
    <button class="btn btn-mint" id="pauseBtn">⏯️ 暂停 (P)</button>
    <div class="dpad">
      <button class="dpad-btn dpad-up">▲</button>
      <button class="dpad-btn dpad-left">◀</button>
      <button class="dpad-btn dpad-right">▶</button>
      <button class="dpad-btn dpad-down">▼</button>
    </div>
  </div>
</div>

<script src="../js/utils.js"></script>
<script>
(function() {
  const canvas = document.getElementById('snakeCanvas');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const lengthEl = document.getElementById('length');
  const foodLabel = document.getElementById('foodLabel');
  const pauseOverlay = document.getElementById('pauseOverlay');
  const pauseBtn = document.getElementById('pauseBtn');
  const wrapBtn = document.getElementById('wrapBtn');

  const COLS = 20, ROWS = 20;

  let snake, foods, obstacles, direction, nextDirection, score, gameOver, gameLoop, speed, baseSpeed, paused;
  let particles = [], wallWrap = true;
  const SPEEDS = { slow: 150, medium: 110, fast: 75 };
  let difficulty = 'slow';

  function resize() {
    const size = Math.min(440, window.innerWidth - 32);
    canvas.style.width = size + 'px'; canvas.style.height = size + 'px';
    const dpr = window.devicePixelRatio || 1;
    canvas.width = size * dpr; canvas.height = size * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function init() {
    clearInterval(gameLoop);
    resize();
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    direction = 'right'; nextDirection = 'right';
    score = 0; paused = false; gameOver = false;
    baseSpeed = SPEEDS[difficulty]; speed = baseSpeed;
    particles = []; foods = []; obstacles = [];
    scoreEl.textContent = '0'; lengthEl.textContent = snake.length;
    bestEl.textContent = loadBestScore('snake');
    foodLabel.textContent = '';
    pauseOverlay.classList.remove('show');
    pauseBtn.textContent = '⏯️ 暂停 (P)';
    spawnFood('normal');
    draw();
    gameLoop = setInterval(tick, speed);
  }

  function getEmptyCells() {
    const occupied = new Set(snake.map(s => s.x + ',' + s.y));
    foods.forEach(f => occupied.add(f.x + ',' + f.y));
    obstacles.forEach(o => occupied.add(o.x + ',' + o.y));
    const empty = [];
    for (let x = 0; x < COLS; x++) for (let y = 0; y < ROWS; y++) if (!occupied.has(x + ',' + y)) empty.push({ x, y });
    return empty;
  }

  function spawnFood(type) {
    const empty = getEmptyCells();
    if (empty.length === 0) return;
    const pos = pickRandom(empty);
    foods.push({ ...pos, type, spawnTime: Date.now() });
    updateFoodLabel();
  }

  function updateFoodLabel() {
    const parts = [];
    const counts = {};
    foods.forEach(f => { counts[f.type] = (counts[f.type] || 0) + 1; });
    if (counts.normal) parts.push('🍎x' + counts.normal);
    if (counts.golden) parts.push('⭐x' + counts.golden);
    if (counts.poison) parts.push('☠️x' + counts.poison);
    foodLabel.textContent = parts.join(' ');
  }

  function spawnObstacle() {
    const empty = getEmptyCells();
    if (empty.length === 0) return;
    const pos = pickRandom(empty);
    obstacles.push(pos);
  }

  function togglePause() {
    if (gameOver) return;
    paused = !paused;
    if (paused) { clearInterval(gameLoop); pauseOverlay.classList.add('show'); pauseBtn.textContent = '▶️ 继续 (P)'; }
    else { pauseOverlay.classList.remove('show'); pauseBtn.textContent = '⏯️ 暂停 (P)'; gameLoop = setInterval(tick, speed); }
  }

  function wrapCoord(val, max) { return ((val % max) + max) % max; }

  function tick() {
    if (gameOver || paused) return;
    direction = nextDirection;
    const head = { ...snake[0] };
    if (direction === 'right') head.x++;
    if (direction === 'left') head.x--;
    if (direction === 'up') head.y--;
    if (direction === 'down') head.y++;

    // Wall or wrap
    if (wallWrap) {
      head.x = wrapCoord(head.x, COLS);
      head.y = wrapCoord(head.y, ROWS);
    } else {
      if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) { endGame(); return; }
    }

    // Self collision
    if (snake.some(s => s.x === head.x && s.y === head.y)) { endGame(); return; }

    // Obstacle collision
    if (obstacles.some(o => o.x === head.x && o.y === head.y)) { endGame(); return; }

    snake.unshift(head);

    // Check food
    const foodIdx = foods.findIndex(f => f.x === head.x && f.y === head.y);
    if (foodIdx !== -1) {
      const eaten = foods[foodIdx];
      foods.splice(foodIdx, 1);

      if (eaten.type === 'poison') {
        // Shrink snake
        score = Math.max(0, score - 2);
        const shrink = Math.min(3, snake.length - 1);
        snake.splice(snake.length - shrink, shrink);
        spawnParticles(head.x, head.y, 'poison');
      } else {
        const points = eaten.type === 'golden' ? 3 : 1;
        score += points;
        spawnParticles(head.x, head.y, eaten.type);
        // Growing obstacles
        if (score > 0 && score % 8 === 0 && obstacles.length < 8) spawnObstacle();
      }

      scoreEl.textContent = score;
      lengthEl.textContent = snake.length;
      // Keep 1-2 normal foods, periodically add golden/poison
      spawnFood('normal');
      if (score > 3 && Math.random() < 0.1) spawnFood('golden');
      if (score > 5 && Math.random() < 0.08) spawnFood('poison');
      // Remove stale golden/poison after 5s
      foods = foods.filter(f => f.type === 'normal' || Date.now() - f.spawnTime < 5000);
      updateFoodLabel();
      // Speed up
      speed = Math.max(50, baseSpeed - Math.floor(score / 5) * 8);
      clearInterval(gameLoop);
      gameLoop = setInterval(tick, speed);
    } else {
      snake.pop();
      // Clean up stale special foods
      const before = foods.length;
      foods = foods.filter(f => f.type === 'normal' || Date.now() - f.spawnTime < 5000);
      if (foods.length !== before) updateFoodLabel();
    }
    draw();
  }

  function spawnParticles(gx, gy, type) {
    const cfg = { normal: { count: 6, color: 'rgba(255,181,194,A)', size: 4.5 }, golden: { count: 14, color: 'rgba(255,215,0,A)', size: 4.5 }, poison: { count: 10, color: 'rgba(160,32,240,A)', size: 5 } };
    const c = cfg[type] || cfg.normal;
    for (let i = 0; i < c.count; i++) {
      particles.push({ x: gx, y: gy, vx: (Math.random() - 0.5) * 4, vy: (Math.random() - 0.5) * 4, life: 18, color: c.color, size: c.size });
    }
  }

  function draw() {
    const cs = canvas.width / (window.devicePixelRatio || 1) / COLS;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    // Background
    ctx.fillStyle = '#FFFBF7'; ctx.fillRect(0, 0, cs * COLS, cs * ROWS);
    for (let x = 0; x < COLS; x++) for (let y = 0; y < ROWS; y++) {
      if ((x + y) % 2 === 0) { ctx.fillStyle = '#FFF5F0'; ctx.fillRect(x * cs, y * cs, cs, cs); }
    }

    // Obstacles
    obstacles.forEach(o => {
      ctx.fillStyle = '#C4B5C4'; ctx.beginPath(); ctx.roundRect(o.x * cs + 2, o.y * cs + 2, cs - 4, cs - 4, 4); ctx.fill();
      ctx.fillStyle = '#A090A0'; ctx.font = `${cs * 0.6}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('🧱', o.x * cs + cs / 2, o.y * cs + cs / 2);
    });

    // Foods
    const emojiMap = { normal: '🍎', golden: '⭐', poison: '☠️' };
    foods.forEach(f => {
      if (f.type === 'golden') { ctx.fillStyle = 'rgba(255,215,0,0.15)'; ctx.beginPath(); ctx.arc(f.x * cs + cs / 2, f.y * cs + cs / 2, cs * 0.5, 0, Math.PI * 2); ctx.fill(); }
      ctx.font = `${cs * 0.85}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(emojiMap[f.type], f.x * cs + cs / 2, f.y * cs + cs / 2);
    });

    // Snake
    snake.forEach((s, i) => {
      const x = s.x * cs, y = s.y * cs;
      ctx.fillStyle = i === 0 ? '#81C784' : (i % 2 === 0 ? '#B5EAD7' : '#C8F0DB');
      ctx.beginPath(); ctx.roundRect(x + 1, y + 1, cs - 2, cs - 2, 6); ctx.fill();
      if (i === 0) {
        ctx.fillStyle = '#fff'; ctx.beginPath();
        let ex = x + cs / 2, ey = y + cs / 2;
        if (direction === 'right') { ctx.arc(ex + 4, ey - 3, 3.5, 0, Math.PI * 2); ctx.arc(ex + 4, ey + 3, 3.5, 0, Math.PI * 2); }
        else if (direction === 'left') { ctx.arc(ex - 4, ey - 3, 3.5, 0, Math.PI * 2); ctx.arc(ex - 4, ey + 3, 3.5, 0, Math.PI * 2); }
        else if (direction === 'up') { ctx.arc(ex - 3, ey - 4, 3.5, 0, Math.PI * 2); ctx.arc(ex + 3, ey - 4, 3.5, 0, Math.PI * 2); }
        else { ctx.arc(ex - 3, ey + 4, 3.5, 0, Math.PI * 2); ctx.arc(ex + 3, ey + 4, 3.5, 0, Math.PI * 2); }
        ctx.fill(); ctx.fillStyle = '#333'; ctx.beginPath();
        if (direction === 'right') { ctx.arc(ex + 5, ey - 3, 1.8, 0, Math.PI * 2); ctx.arc(ex + 5, ey + 3, 1.8, 0, Math.PI * 2); }
        else if (direction === 'left') { ctx.arc(ex - 5, ey - 3, 1.8, 0, Math.PI * 2); ctx.arc(ex - 5, ey + 3, 1.8, 0, Math.PI * 2); }
        else if (direction === 'up') { ctx.arc(ex - 3, ey - 5, 1.8, 0, Math.PI * 2); ctx.arc(ex + 3, ey - 5, 1.8, 0, Math.PI * 2); }
        else { ctx.arc(ex - 3, ey + 5, 1.8, 0, Math.PI * 2); ctx.arc(ex + 3, ey + 5, 1.8, 0, Math.PI * 2); }
        ctx.fill();
      }
    });

    // Particles
    particles = particles.filter(p => p.life > 0);
    particles.forEach(p => {
      ctx.fillStyle = p.color.replace('A', String(p.life / 18));
      ctx.beginPath(); ctx.arc(p.x * cs + cs / 2, p.y * cs + cs / 2, p.size, 0, Math.PI * 2); ctx.fill();
      p.x += p.vx * 0.1; p.y += p.vy * 0.1; p.life--;
    });
    if (!gameOver && particles.length > 0) requestAnimationFrame(draw);
  }

  function endGame() {
    gameOver = true; clearInterval(gameLoop);
    saveBestScore('snake', score);
    bestEl.textContent = loadBestScore('snake');
    foodLabel.textContent = '';
    draw();
    setTimeout(() => {
      showModal({ emoji: '🐍', title: '游戏结束', message: `得分: ${score} | 长度: ${snake.length}\n最佳: ${loadBestScore('snake')}`, buttons: [{ text: '再来一局', cls: 'btn-primary', onClick: init }, { text: '返回大厅', cls: 'btn-secondary', onClick: () => { window.location.href = '../index.html'; } }] });
    }, 200);
  }

  // Wall wrap toggle
  wrapBtn.addEventListener('click', () => { wallWrap = !wallWrap; wrapBtn.classList.toggle('on', wallWrap); wrapBtn.textContent = wallWrap ? '🔄 穿墙' : '🧱 实墙'; });

  document.querySelectorAll('.diff-btn').forEach(btn => { btn.addEventListener('click', () => { document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); difficulty = btn.dataset.speed; init(); }); });

  pauseBtn.addEventListener('click', togglePause);

  const OPPOSITES = { up: 'down', down: 'up', left: 'right', right: 'left' };
  document.addEventListener('keydown', (e) => {
    if (e.key === 'p' || e.key === 'P') { togglePause(); e.preventDefault(); return; }
    if (paused || gameOver) return;
    const map = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', w: 'up', s: 'down', a: 'left', d: 'right' };
    const dir = map[e.key];
    if (dir && OPPOSITES[dir] !== direction) { nextDirection = dir; e.preventDefault(); }
  });

  detectSwipe(canvas, (dir) => { if (paused || gameOver) return; if (OPPOSITES[dir] !== direction) nextDirection = dir; });

  setupDpad({ up: () => { if (!paused && !gameOver && OPPOSITES.up !== direction) nextDirection = 'up'; }, down: () => { if (!paused && !gameOver && OPPOSITES.down !== direction) nextDirection = 'down'; }, left: () => { if (!paused && !gameOver && OPPOSITES.left !== direction) nextDirection = 'left'; }, right: () => { if (!paused && !gameOver && OPPOSITES.right !== direction) nextDirection = 'right'; } });

  window.addEventListener('resize', resize);
  init();
})();
</script>
</body>
</html>
